# Home server:
#   cp .env.example .env            (fill it in)
#   docker compose build
#   docker compose run --rm balance-worker npm run link-indigo     (one-time Indigo sign-in)
#   docker compose up -d
services:
  balance-worker:
    build: .
    container_name: giftcard-balance-worker
    restart: unless-stopped
    env_file: .env
    # Chromium needs a larger /dev/shm than Docker's 64 MB default.
    shm_size: 512mb
    volumes:
      # Saved Indigo sign-in. Treat like a password: it lets its holder use your Indigo account.
      - indigo-state:/app/state
    # Live view for assisted checks (Sport Chek): your phone opens it to tick
    # "I'm not a robot". Home network / Tailscale only: never forward this port on
    # your router. Remove this if you don't use assisted checks.
    ports:
      - '8787:8787'
    logging:
      driver: json-file
      options: { max-size: '5m', max-file: '3' }

volumes:
  indigo-state:
